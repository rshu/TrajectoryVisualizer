name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      # Avoid Gradio phoning home during build_ui() in tests.
      GRADIO_ANALYTICS_ENABLED: "False"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync (frozen lockfile)
        run: uv sync --frozen --python ${{ matrix.python-version }}

      - name: Import smoke test
        run: |
          uv run python -c "from trajectory_visualizer.insight.insight import build_ui; build_ui(); print('insight build_ui OK')"
          uv run python -c "from trajectory_visualizer.converge.app import build_ui; build_ui(); print('converge build_ui OK')"

      - name: Compile-all
        run: uv run python -m compileall -q trajectory_visualizer scripts

      - name: Tests
        run: uv run pytest
