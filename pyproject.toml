[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trajectory-visualizer"
version = "0.1.0"
description = "Offline analytics & visualization for LLM agent trajectories (Claude Code, OpenCode, CodeArts)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Rui Shu" }]
keywords = ["llm", "agent", "trajectory", "visualization", "analytics", "gradio", "plotly"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "gradio>=6.14.0",
    "gradio_client>=2.5.0",
    "plotly>=5.0",
    "pygments>=2.0",
    "pandas>=2.0",
    "requests>=2.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
trajectory-visualizer = "trajectory_visualizer.insight.__main__:main"

[project.urls]
Homepage = "https://github.com/rshu/TrajectoryVisualizer"
Repository = "https://github.com/rshu/TrajectoryVisualizer"
Issues = "https://github.com/rshu/TrajectoryVisualizer/issues"

[tool.hatch.build.targets.wheel]
packages = ["trajectory_visualizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
